name: storefront-build
on:
  push:
    paths: ["storefront/**", ".github/workflows/storefront-build.yml"]
  pull_request:
    paths: ["storefront/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - run: npm ci
      - run: npm run build
        # No env secrets needed: the build tolerates missing backend/keys
        # (falls back to clearly-marked sample data).
env:
  CI: "true"
